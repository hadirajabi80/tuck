appId: com.tuck.app
productName: Tuck
copyright: Copyright © 2026 Tuck
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
# Tray / runtime icons are read at runtime from process.resourcesPath/icons (packaged)
# or <appPath>/build (dev) — see DESIGN.md §0.
extraResources:
  - from: build
    to: icons
    filter:
      - icon.png
      - tray*.png
      - tray.ico
      - trayTemplate.png
      - trayTemplate@2x.png
# koffi 3 loads its prebuilt .node from a per-platform optional package (@koromix/koffi-<platform>-<arch>).
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
npmRebuild: false
# Auto-update (electron-updater): builds emit latest.yml (+ .blockmap) next to the installer; the app reads
# them from GitHub Releases. Scripts pass --publish never — the release assets are uploaded by hand.
publish:
  provider: github
  owner: hadirajabi80
  repo: tuck
  releaseType: release
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  # No spaces: GitHub turns spaces in asset names into dots, and latest.yml must name the uploaded file exactly.
  artifactName: "Tuck-Setup-${version}.${ext}"
mac:
  # One build per architecture (Apple Silicon + Intel) rather than universal: koffi's native module comes from
  # a different package per arch, which a universal merge can't reconcile. zip is what electron-updater reads.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: "Tuck-${version}-${arch}.${ext}"
  # No Apple Developer ID yet: ad-hoc sign so the app runs on Apple Silicon (unsigned arm64 code is killed).
  identity: "-"
  notarize: false
  # electron-builder generates the .icns from this 1024×1024 PNG.
  icon: build/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSAppleEventsUsageDescription: "Tuck sends a paste keystroke to the app you were using."
dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
