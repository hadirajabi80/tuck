# Builds the macOS apps (Apple Silicon + Intel) on a GitHub-hosted Mac and attaches them to a release.
# Windows assets are built and uploaded by hand (npm run dist:win); this adds the Mac DMG/ZIP files and
# latest-mac.yml to the same release. Runs when a release is published, or manually for an existing tag.
name: Release macOS

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload (e.g. v0.1.5)
        required: true

permissions:
  contents: write

jobs:
  # When a release is published that already has Mac files (e.g. built into the draft by a manual run),
  # don't build them again.
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.assets.outputs.skip }}
    steps:
      - id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "release" ] && \
             gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -qx latest-mac.yml; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm only installs koffi's native package for the runner's own CPU; both Mac builds need theirs.
      - name: Add koffi binaries for both Mac architectures
        run: |
          # koffi's "exports" hides package.json from require(), so read the file directly.
          V=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/koffi/package.json', 'utf8')).version")
          npm install --no-save --force "@koromix/koffi-darwin-arm64@$V" "@koromix/koffi-darwin-x64@$V"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package (dmg + zip, arm64 + x64)
        run: npx electron-builder --mac --arm64 --x64 --publish never

      - name: Smoke test — the Apple Silicon app boots
        run: |
          APP="dist/mac-arm64/Tuck.app"
          codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true
          export TUCK_USER_DATA="$RUNNER_TEMP/tuck-smoke" TUCK_SMOKE_EXIT_MS=12000
          "$APP/Contents/MacOS/Tuck" > "$RUNNER_TEMP/smoke.out" 2>&1 || true
          cat "$TUCK_USER_DATA/logs/main.log" || cat "$RUNNER_TEMP/smoke.out"
          grep -q "ready in" "$TUCK_USER_DATA/logs/main.log"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/Tuck-*.dmg dist/Tuck-*.zip dist/Tuck-*.blockmap dist/latest-mac.yml --clobber
